name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Pebble and Challtestsrv
        # pebble v2.7.0 起 module path 为 post-v2（github.com/letsencrypt/pebble/v2），
        # 旧导入路径安装报 "invalid version: go.mod has post-v2 module path"。
        run: |
          go install github.com/letsencrypt/pebble/v2/...@v2.7.0

      - name: Run Tests (-race)
        run: |
          go test -race ./acme/... ./pkg/... ./cmd/...

  build:
    name: Build Binaries & Check Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build Binaries
        # Dockerfile COPY dist/<name>_${TARGETOS}_${TARGETARCH}；CI dry-run 构建与
        # runner 同架构（amd64）产物即可，交叉全平台由 Release 工作流负责。
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/openbao-plugin-secrets-acme_linux_amd64 ./cmd/plugin
          GOOS=linux GOARCH=amd64 go build -o dist/bao-acme_linux_amd64 ./cmd/bao-acme

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI Image (Dry-run / No push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: openbao-plugin-secrets-acme:test
