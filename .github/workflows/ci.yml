name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Pebble and Challtestsrv
        run: |
          go install github.com/letsencrypt/pebble/...@v2.7.0
          go install github.com/letsencrypt/pebble/cmd/pebble-challtestsrv@v2.7.0

      - name: Run Tests (-race)
        run: |
          go test -race ./acme/... ./pkg/... ./cmd/...

  build:
    name: Build Binaries & Check Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build Binaries
        run: |
          go build -o dist/openbao-plugin-secrets-acme ./cmd/plugin
          go build -o dist/bao-acme ./cmd/bao-acme

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI Image (Dry-run / No push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: openbao-plugin-secrets-acme:test
