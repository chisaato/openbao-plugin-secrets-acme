name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: extractions/setup-just@v4
      # challtestsrv 已从 pebble v2 主模块拆出：必须用 v2 子路径安装；
      # 固定 v2.10.1 保证 challtestsrv 管理 API（/set-txt、/clear-txt）与
      # 验收测试 fixture 一致。pebble 本体仍可跟随 @latest。
      - run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@latest
      - run: go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
      - name: Install bao
        # OpenBao v2.x 资产命名为 openbao_<ver>_linux_amd64.tar.gz（无版本无关的 zip），
        # 需先取最新 tag 拼出下载地址。
        run: |
          ver="$(curl -sL https://api.github.com/repos/openbao/openbao/releases/latest | jq -r .tag_name | sed 's/^v//')"
          curl -sL "https://github.com/openbao/openbao/releases/download/v${ver}/openbao_${ver}_linux_amd64.tar.gz" -o bao.tgz
          tar -xzf bao.tgz bao && sudo mv bao /usr/local/bin/
      - run: just vet
      - run: just test
      # testacc 目标自身在 test/ 独立 module 内运行（见 justfile），勿重复 cd。
      - run: chmod +x test/acme-dns.sh && just build && just testacc
