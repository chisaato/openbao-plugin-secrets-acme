# OpenBao 本地测试环境（含 ACME 插件加载），用法见 docs/local-testing.md。
services:
  bao:
    image: openbao/openbao:2.6.2
    # container_name: bao-acme-local
    # 镜像默认 entrypoint 会切到 uid=100(openbao) 并以 config-dir 模式重复加载配置；
    # 本地测试直接以 root 运行 bao、显式指定配置文件，行为完全确定
    # （生产部署请用权限规范的用户/目录/存储，不要照抄这两行）。
    user: "0:0"
    entrypoint: ["bao"]
    cap_add:
      - IPC_LOCK # bao 启动时 mlock 内存
    ports:
      - "8200:8200"
    volumes:
      - ./data/data:/openbao/data          # 持久化存储（raft 单节点）
      - ./data/plugins:/openbao/plugins    # 插件二进制目录（放 bin/ 构建产物）
      - ./bao-config.hcl:/openbao/bao-config.hcl:ro
    command: ["server", "-config=/openbao/bao-config.hcl"]
